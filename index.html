<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap"
        rel="stylesheet" />

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://ble-project-c24f9-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const sensorRef = ref(db, "SensorData");

        function formatValue(val) {
            if (val === null || val === undefined) return "—";
            if (typeof val === "boolean") return val ? "TRUE" : "FALSE";
            if (typeof val === "number") return val.toLocaleString();
            return String(val);
        }

        function getUnit(key) {
            const k = key.toLowerCase();
            if (k.includes("temp")) return "°C";
            if (k.includes("humid")) return "%";
            if (k.includes("pressure")) return "hPa";
            if (k.includes("voltage") || k.includes("volt")) return "V";
            if (k.includes("current") || k.includes("amp")) return "A";
            if (k.includes("power")) return "W";
            if (k.includes("light") || k.includes("lux")) return "lx";
            if (k.includes("co2")) return "ppm";
            if (k.includes("pm")) return "µg/m³";
            if (k.includes("speed")) return "m/s";
            if (k.includes("altitude")) return "m";
            if (k.includes("battery")) return "%";
            return "";
        }

        const ICONS = {
            temp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>`,
            humid: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
            pressure: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>`,
            voltage: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
            current: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
            power: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>`,
            light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
            co2: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><circle cx="12" cy="12" r="3"/></svg>`,
            battery: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>`,
            time: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            id: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="15" x2="13" y2="15"/></svg>`,
            status: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>`,
            distance: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M3 6l3 6-3 6"/><path d="M21 6l-3 6 3 6"/></svg>`,
            fall: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v6"/><path d="M9 10l3 3 3-3"/><path d="M9 17l3 4 3-4"/></svg>`,
            gas: `<svg xmlns="http://www.w3.org/2000/svg"stroke="#00e5ff" fill="#00e5ff" width="800px" height="800px" viewBox="0 0 24 24" fill="none"><path d="M16 22V8C16 5.17157 16 3.75736 15.1213 2.87868C14.2426 2 12.8284 2 10 2H9C6.17157 2 4.75736 2 3.87868 2.87868C3 3.75736 3 5.17157 3 8V22" stroke="#1C274C" stroke width="1.5"/><path d="M11 6H8C7.05719 6 6.58579 6 6.29289 6.29289C6 6.58579 6 7.05719 6 8C6 8.94281 6 9.41421 6.29289 9.70711C6.58579 10 7.05719 10 8 10H11C11.9428 10 12.4142 10 12.7071 9.70711C13 9.41421 13 8.94281 13 8C13 7.05719 13 6.58579 12.7071 6.29289C12.4142 6 11.9428 6 11 6Z" stroke="#1C274C" stroke-width="1.5"/><path d="M7 17H12" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"/>
<path d="M17 22H2" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"/><path d="M19.5 4L20.7331 4.98647C20.8709 5.09673 20.9398 5.15186 21.0025 5.20805C21.5937 5.73807 21.9508 6.48086 21.9953 7.27364C22 7.35769 22 7.44594 22 7.62244V18.5C22 19.3284 21.3284 20 20.5 20C19.6716 20 19 19.3284 19 18.5V18.4286C19 17.6396 18.3604 17 17.5714 17H16" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"/><path d="M22 8H20.5C19.6716 8 19 8.67157 19 9.5V11.9189C19 12.5645 19.4131 13.1377 20.0257 13.3419L22 14" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"/></svg>`,
            lat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
            lon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
            zone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
            default: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
        };

        function getIcon(key) {
            const k = key.toLowerCase();
            if (k.includes("temp")) return ICONS.temp;
            if (k.includes("humid")) return ICONS.humid;
            if (k.includes("pressure")) return ICONS.pressure;
            if (k.includes("voltage") || k.includes("volt")) return ICONS.voltage;
            if (k.includes("current") || k.includes("amp")) return ICONS.current;
            if (k.includes("power")) return ICONS.power;
            if (k.includes("light") || k.includes("lux")) return ICONS.light;
            if (k.includes("co2")) return ICONS.co2;
            if (k.includes("battery")) return ICONS.battery;
            if (k.includes("time") || k.includes("date")) return ICONS.time;
            if (k.includes("id") || k.includes("mac")) return ICONS.id;
            if (k.includes("status") || k.includes("state")) return ICONS.status;
            if (k.includes("distance")) return ICONS.distance;
            if (k.includes("fall")) return ICONS.fall;
            if (k.includes("gas")) return ICONS.gas;
            if (k.includes("lat")) return ICONS.lat;
            if (k.includes("lon")) return ICONS.lon;
            if (k.includes("zone")) return ICONS.zone;
            return ICONS.default;
        }

        function flashValue(el) {
            el.classList.remove("value-flash");
            void el.offsetWidth; // force reflow to re-trigger animation
            el.classList.add("value-flash");
        }

        function renderCards(data, parentEl) {
            // Remove loading placeholders on first real render
            parentEl.querySelectorAll(".loading-card").forEach(el => el.remove());

            if (typeof data !== "object" || data === null) {
                // Single primitive value — handle separately
                let card = document.getElementById("card-__single__");
                if (!card) {
                    card = document.createElement("div");
                    card.className = "card";
                    card.id = "card-__single__";
                    card.innerHTML = `
                        <div class="card-icon">📊</div>
                        <div class="card-label">Value</div>
                        <div class="card-value" id="value-__single__">—</div>
                    `;
                    parentEl.appendChild(card);
                }
                const el = document.getElementById("value-__single__");
                const newVal = formatValue(data);
                if (el.dataset.last !== newVal) {
                    el.dataset.last = newVal;
                    el.innerHTML = newVal;
                    flashValue(el);
                }
                return;
            }

            const entries = Object.entries(data);

            entries.forEach(([key, value], i) => {
                const cardId = "card-" + key;
                let card = document.getElementById(cardId);

                if (typeof value === "object" && value !== null) {
                    // ── Nested object card ──────────────────────────────
                    if (!card) {
                        card = document.createElement("div");
                        card.className = "card card-nested";
                        card.id = cardId;
                        card.style.animationDelay = `${i * 60}ms`;
                        card.innerHTML = `
                            <div class="card-icon">${getIcon(key)}</div>
                            <div class="card-label">${key}</div>
                            <div class="nested-grid" id="nested-${key}"></div>
                        `;
                        parentEl.appendChild(card);
                    }

                    // Update only nested values that changed
                    const nestedGrid = document.getElementById("nested-" + key);
                    Object.entries(value).forEach(([k, v]) => {
                        const nestedValId = `nested-val-${key}-${k}`;
                        let nestedItem = document.getElementById(`nested-item-${key}-${k}`);

                        if (!nestedItem) {
                            nestedItem = document.createElement("div");
                            nestedItem.className = "nested-item";
                            nestedItem.id = `nested-item-${key}-${k}`;
                            nestedItem.innerHTML = `
                                <span class="nested-key">${k}</span>
                                <span class="nested-val" id="${nestedValId}">—<span class="unit">${getUnit(k)}</span></span>
                            `;
                            nestedGrid.appendChild(nestedItem);
                        }

                        const nestedValEl = document.getElementById(nestedValId);
                        const newVal = formatValue(v);
                        if (nestedValEl && nestedValEl.dataset.last !== newVal) {
                            nestedValEl.dataset.last = newVal;
                            nestedValEl.innerHTML = `${newVal}<span class="unit">${getUnit(k)}</span>`;
                            flashValue(nestedValEl);
                        }
                    });

                } else {
                    // ── Simple value card ───────────────────────────────
                    if (!card) {
                        card = document.createElement("div");
                        card.className = "card";
                        card.id = cardId;
                        card.style.animationDelay = `${i * 60}ms`;
                        card.innerHTML = `
                            <div class="card-icon">${getIcon(key)}</div>
                            <div class="card-label">${key}</div>
                            <div class="card-value" id="value-${key}">—</div>
                        `;
                        parentEl.appendChild(card);
                    }

                    const valueEl = document.getElementById("value-" + key);
                    const unit = getUnit(key);
                    const newVal = formatValue(value);

                    if (valueEl && valueEl.dataset.last !== newVal) {
                        valueEl.dataset.last = newVal;
                        valueEl.innerHTML = `${newVal}<span class="unit">${unit}</span>`;
                        flashValue(valueEl);
                    }
                }
            });
        }

        function updateTimestamp() {
            const el = document.getElementById("last-updated");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("sensor-grid");
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");
            const errorBox = document.getElementById("error-box");

            onValue(sensorRef, (snapshot) => {
                const data = snapshot.val();

                statusDot.className = "dot dot-live";
                statusText.textContent = "LIVE";
                errorBox.style.display = "none";
                updateTimestamp();

                if (data === null) {
                    grid.innerHTML = `<div class="empty-state">No data found at <code>SensorData</code>.<br>Make sure data is being written to Firebase.</div>`;
                    return;
                }

                renderCards(data, grid);
            }, (error) => {
                statusDot.className = "dot dot-error";
                statusText.textContent = "ERROR";
                errorBox.style.display = "block";
                errorBox.textContent = `Firebase error: ${error.message}`;
                grid.innerHTML = `<div class="empty-state">Could not load data. Check Firebase rules or database URL.</div>`;
            });
        });
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0c10;
            --surface: #111418;
            --surface2: #181c23;
            --border: #222832;
            --accent: #00e5ff;
            --accent2: #7c3aed;
            --text: #e8edf5;
            --muted: #5a6278;
            --success: #00e5ff;
            --error: #ff4466;
            --font-display: 'Syne', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        html,
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-display);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.06) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb2 {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--muted);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .dot-live {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        .dot-error {
            background: var(--error);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .db-path {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        .hero {
            padding: 56px 0 40px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .hero-title span {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--muted);
            line-height: 1.8;
            text-align: right;
        }

        #error-box {
            display: none;
            background: rgba(255, 68, 102, 0.08);
            border: 1px solid rgba(255, 68, 102, 0.3);
            color: var(--error);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }

        #sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px 22px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.4s ease both;
            /* NO transition on the card itself — only hover is allowed */
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 229, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 229, 255, 0.07);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-nested {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .card-nested {
                grid-column: span 1;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Value flash — only the number text changes color, nothing else moves */
        @keyframes value-flash {
            0% {
                color: var(--accent);
            }

            100% {
                color: var(--text);
            }
        }

        .value-flash {
            animation: value-flash 0.7s ease-out forwards;
        }

        .card-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 14px;
            display: block;
            color: var(--accent);
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
        }

        .card-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .card-value {
            font-family: var(--font-mono);
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .unit {
            font-size: 0.75em;
            color: var(--accent);
            font-weight: 400;
        }

        .nested-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .nested-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border);
        }

        .nested-key {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--muted);
        }

        .nested-val {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: var(--text);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 2;
            padding: 60px 20px;
            border: 1px dashed var(--border);
            border-radius: 16px;
        }

        .empty-state code {
            color: var(--accent);
        }

        .loading-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        footer {
            text-align: center;
            margin-top: 60px;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }
    </style>
</head>
