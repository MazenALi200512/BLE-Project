<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap"
        rel="stylesheet" />

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://ble-project-c24f9-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const sensorRef = ref(db, "SensorData");

        function formatValue(val) {
            if (val === null || val === undefined) return "—";
            if (typeof val === "boolean") return val ? "TRUE" : "FALSE";
            if (typeof val === "number") return val.toLocaleString();
            return String(val);
        }

        function getUnit(key) {
            const k = key.toLowerCase();
            if (k.includes("temp")) return "°C";
            if (k.includes("humid")) return "%";
            if (k.includes("pressure")) return "hPa";
            if (k.includes("voltage") || k.includes("volt")) return "V";
            if (k.includes("current") || k.includes("amp")) return "A";
            if (k.includes("power")) return "W";
            if (k.includes("light") || k.includes("lux")) return "lx";
            if (k.includes("co2")) return "ppm";
            if (k.includes("pm")) return "µg/m³";
            if (k.includes("speed")) return "m/s";
            if (k.includes("altitude")) return "m";
            if (k.includes("battery")) return "%";
            return "";
        }

        function getIcon(key) {
            const k = key.toLowerCase();
            if (k.includes("temp")) return "🌡";
            if (k.includes("humid")) return "💧";
            if (k.includes("pressure")) return "🌬";
            if (k.includes("voltage") || k.includes("volt")) return "⚡";
            if (k.includes("current") || k.includes("amp")) return "🔌";
            if (k.includes("power")) return "⚙";
            if (k.includes("light") || k.includes("lux")) return "☀";
            if (k.includes("co2")) return "🌫";
            if (k.includes("battery")) return "🔋";
            if (k.includes("time") || k.includes("date")) return "🕐";
            if (k.includes("id") || k.includes("mac")) return "🔑";
            if (k.includes("status") || k.includes("state")) return "📡";
            return "📊";
        }

        function renderCards(data, parentEl) {
            parentEl.innerHTML = "";
            if (typeof data !== "object" || data === null) {
                const single = document.createElement("div");
                single.className = "card";
                single.innerHTML = `<div class="card-icon">📊</div><div class="card-label">Value</div><div class="card-value">${formatValue(data)}</div>`;
                parentEl.appendChild(single);
                return;
            }

            const entries = Object.entries(data);
            entries.forEach(([key, value], i) => {
                const card = document.createElement("div");
                card.className = "card";
                card.style.animationDelay = `${i * 60}ms`;

                if (typeof value === "object" && value !== null) {
                    // Nested object — render as sub-section
                    card.classList.add("card-nested");
                    card.innerHTML = `
            <div class="card-icon">${getIcon(key)}</div>
            <div class="card-label">${key}</div>
            <div class="nested-grid">
              ${Object.entries(value).map(([k, v]) => `
                <div class="nested-item">
                  <span class="nested-key">${k}</span>
                  <span class="nested-val">${formatValue(v)}<span class="unit">${getUnit(k)}</span></span>
                </div>
              `).join("")}
            </div>
          `;
                } else {
                    const unit = getUnit(key);
                    card.innerHTML = `
            <div class="card-icon">${getIcon(key)}</div>
            <div class="card-label">${key}</div>
            <div class="card-value">${formatValue(value)}<span class="unit">${unit}</span></div>
          `;
                }

                parentEl.appendChild(card);
            });
        }

        function updateTimestamp() {
            const el = document.getElementById("last-updated");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("sensor-grid");
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");
            const errorBox = document.getElementById("error-box");

            onValue(sensorRef, (snapshot) => {
                const data = snapshot.val();

                statusDot.className = "dot dot-live";
                statusText.textContent = "LIVE";
                errorBox.style.display = "none";
                updateTimestamp();

                if (data === null) {
                    grid.innerHTML = `<div class="empty-state">No data found at <code>SensorData</code>.<br>Make sure data is being written to Firebase.</div>`;
                    return;
                }

                renderCards(data, grid);
            }, (error) => {
                statusDot.className = "dot dot-error";
                statusText.textContent = "ERROR";
                errorBox.style.display = "block";
                errorBox.textContent = `Firebase error: ${error.message}`;
                grid.innerHTML = `<div class="empty-state">Could not load data. Check Firebase rules or database URL.</div>`;
            });
        });
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0c10;
            --surface: #111418;
            --surface2: #181c23;
            --border: #222832;
            --accent: #00e5ff;
            --accent2: #7c3aed;
            --text: #e8edf5;
            --muted: #5a6278;
            --success: #00e5ff;
            --error: #ff4466;
            --font-display: 'Syne', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        html,
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-display);
        }

        /* Animated grid background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.06) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb2 {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--muted);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .dot-live {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        .dot-error {
            background: var(--error);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .db-path {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        /* Hero */
        .hero {
            padding: 56px 0 40px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .hero-title span {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--muted);
            line-height: 1.8;
            text-align: right;
        }

        /* Error */
        #error-box {
            display: none;
            background: rgba(255, 68, 102, 0.08);
            border: 1px solid rgba(255, 68, 102, 0.3);
            color: var(--error);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }

        /* Grid */
        #sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px 22px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.4s ease both;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 229, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 229, 255, 0.07);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-nested {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .card-nested {
                grid-column: span 1;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-icon {
            font-size: 1.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .card-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .card-value {
            font-family: var(--font-mono);
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .unit {
            font-size: 0.75em;
            color: var(--accent);
            font-weight: 400;
        }

        /* Nested */
        .nested-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .nested-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border);
        }

        .nested-key {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--muted);
        }

        .nested-val {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: var(--text);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 2;
            padding: 60px 20px;
            border: 1px dashed var(--border);
            border-radius: 16px;
        }

        .empty-state code {
            color: var(--accent);
        }

        /* Loading spinner */
        .loading-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        footer {
            text-align: center;
            margin-top: 60px;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>

    <div class="glow-orb"></div>
    <div class="glow-orb2"></div>

    <header>
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">📡</div>
                SensorHub
            </div>
            <div class="header-right">
                <div class="db-path">ble-project-c24f9-default-rtdb / SensorData</div>
                <div class="status-badge">
                    <span class="dot" id="status-dot"></span>
                    <span id="status-text">CONNECTING</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <div>
                <h1 class="hero-title">Sensor<br /><span>Dashboard</span></h1>
            </div>
            <div class="hero-meta">
                Last updated: <span id="last-updated">—</span><br />
                Source: Firebase Realtime DB<br />
                Node: /SensorData
            </div>
        </div>

        <div id="error-box"></div>

        <div id="sensor-grid">
            <!-- Loading placeholders -->
            <div class="loading-card" style="height:120px"></div>
            <div class="loading-card" style="height:120px;animation-delay:.15s"></div>
            <div class="loading-card" style="height:120px;animation-delay:.3s"></div>
            <div class="loading-card" style="height:120px;animation-delay:.45s"></div>
        </div>

        <footer>
            REAL-TIME DATA · FIREBASE REALTIME DATABASE · AUTO-REFRESHING
        </footer>
    </div>

</body>

</html>
